<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 문제</title>
    <style>
        :root {
            --primary-color: #ff5722;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #2c3e50;
            text-align: center;
        }

        .stats {
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .quiz-box {
            margin-bottom: 20px;
        }

        .label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #95a5a6;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .korean-sentence {
            font-size: 1.3rem;
            font-weight: 600;
            background-color: #fdfefe;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.02);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #e64a19;
        }

        .next-btn {
            background-color: #2e7d32;
            margin-top: 15px;
            display: none;
        }

        .next-btn:hover {
            background-color: #1b5e20;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .result-box.correct {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .result-box.incorrect {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>일본어 문제</h1>
        <div class="stats" id="stats">맞춘 문제: 0 / 시도한 문제: 0</div>

        <div class="quiz-box">
            <span class="label">다음 한국어 문장을 일본어로 번역하세요</span>
            <div class="korean-sentence" id="koreanSentence">문장을 불러오는 중...</div>
            
            <input type="text" id="userInput" placeholder="여기에 일본어를 입력하세요..." autofocus>
            <button id="submitBtn" onclick="checkAnswer()">제출하기</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="feedback-title" id="feedbackTitle"></div>
            <div id="feedbackContent"></div>
            <button class="next-btn" id="nextBtn" onclick="loadNewQuestion()">다음 문제 풀기</button>
        </div>
    </div>

    <script>
        // 120개 이상의 방대한 일본어 회화 문장 데이터베이스
        const sentences = [
            { kr: "실례합니다. 메뉴 좀 주세요.", answers: ["すみません、メニューをください", "すいません、メニューをください", "すみませんメニューをください", "すみません、メニューお願いします"], keyword: "メニュー", tip: "메뉴를 달라고 할 때는 'メニューをください'가 가장 자연스럽습니다." },
            { kr: "이것은 얼마입니까?", answers: ["これはいくらですか", "これいくらですか", "これはいくらですか？"], keyword: "いくら", tip: "간단하게 'これ、いくら？'라고 반말로 물어볼 수도 있습니다." },
            { kr: "정말 감사합니다.", answers: ["どうもありがとうございます", "本当にありがとうございます", "ありがとうございます", "どうもありがとうございました"], keyword: "ありがとう", tip: "상황에 따라 'どうも'만 가볍게 쓰기도 합니다." },
            { kr: "지금 몇 시예요?", answers: ["いま何時ですか", "今何時ですか", "いまなんじですか"], keyword: "何時", tip: "시간을 물어볼 때는 '今(いま)'를 붙여주면 명확합니다." },
            { kr: "화장실이 어디에 있습니까?", answers: ["トイレはどこですか", "お手洗いどこですか", "お手洗いはどこですか", "トイレどこですか"], keyword: "トイレ", tip: "조금 더 공공장소나 격식을 차린 곳에서는 'おてあらい(お手洗い)'가 좋습니다." },
            { kr: "다시 한 번 말씀해 주세요.", answers: ["もう一度お願いします", "もういちどおねがいします", "もう一度言ってください", "もう一回言ってください"], keyword: "もう一度", tip: "못 알아들었을 때 'もう一度(いちど)お願いします'라고 하면 유용합니다." },
            { kr: "내일 봐요.", answers: ["また明日", "またあした", "また明日ね", "それではまた明日"], keyword: "明日", tip: "헤어질 때 가볍게 'じゃ、また明日！'라고 하면 친근합니다." },
            { kr: "죄송합니다만, 길 좀 묻겠습니다.", answers: ["すみません、道を教えてください", "すいません道を教えてください", "すみませんが道を聞いてもいいですか"], keyword: "道", tip: "길을 물어볼 때는 '道を教えてください'를 기억하세요." },
            { kr: "이 가까이에 역이 있나요?", answers: ["この近くに駅はありますか", "このちかくにえきはありますか", "近くに駅ありますか"], keyword: "駅", tip: "주변 시설을 물어볼 때 '~近くに ~はありますか' 패턴이 유용합니다." },
            { kr: "영어 할 수 있나요?", answers: ["英語が話せますか", "英語できますか", "英語を話せますか"], keyword: "英語", tip: "능력을 물어볼 때는 가능형(話せますか)을 사용합니다." },
            { kr: "이해하지 못했습니다.", answers: ["わかりません", "理解できませんでした", "よくわかりません"], keyword: "わかりません", tip: "간단하게 'わかりません' 또는 'よくわかりません(잘 모르겠어요)'을 씁니다." },
            { kr: "천천히 말씀해 주세요.", answers: ["ゆっくり話してください", "ゆっくり言ってください", "ゆっくりおねがいします"], keyword: "ゆっくり", tip: "대화가 빠를 때 'ゆっくりお願いします'라고 요청해 보세요." },
            { kr: "이것으로 주세요.", answers: ["これでお願いします", "これにします", "これをください"], keyword: "これ", tip: "가게에서 주문하거나 물건을 고를 때 쓰기 좋습니다." },
            { kr: "카드로 계산할 수 있나요?", answers: ["カードで払えますか", "カード使えますか", "カードで支払いはできますか"], keyword: "カード", tip: "해외 여행 시 'カード使えますか(카드 쓸 수 있나요)?'가 입에 붙으면 편합니다." },
            { kr: "영수증 주세요.", answers: ["領収書をください", "レシートをください", "領収書お願いします"], keyword: "領収書", tip: "일본에서는 영수증을 'レシート(레시토)' 또는 '領収書(료슈쇼)'라고 합니다." },
            { kr: "배고프네요.", answers: ["お腹が減りました", "お腹ペコペコです", "お腹すいた", "お腹が空きました"], keyword: "お腹", tip: "일상 회화에서는 'お腹すいた(배고파)'를 많이 씁니다." },
            { kr: "목마르네요.", answers: ["喉が渇きました", "のどがかわきました", "喉渇いた"], keyword: "喉", tip: "갈증이 날 때 쓰는 표현입니다." },
            { kr: "맛있어요!", answers: ["美味しいです", "おいしいです", "うまい！", "おいしい"], keyword: "美味しい", tip: "식사 후 'ごちそうさまでした(잘 먹었습니다)'도 함께 쓰면 좋습니다." },
            { kr: "계산해주세요.", answers: ["お会計お願いします", "お勘定お願いします", "会計お願いします"], keyword: "会計", tip: "줄여서 'お会計(오카이케이)'라고 합니다." },

            { kr: "괜찮습니다.", answers: ["大丈夫です", "だいじょうぶです", "いいえ、結構です"], keyword: "大丈夫", tip: "거절하거나 안심시킬 때 만능으로 쓰이는 '大丈夫です'입니다." },
            { kr: "죄송합니다.", answers: ["ごめんなさい", "すみません", "申し訳ありません"], keyword: "すみません", tip: "사죄나 가벼운 부름 모두에 'すみません'을 쓸 수 있습니다." },
            { kr: "처음 뵙겠습니다.", answers: ["はじめまして", "初めまして"], keyword: "はじめまして", tip: "인사할 때 가장 먼저 나오는 정석 표현입니다." },
            { kr: "잘 부탁드립니다.", answers: ["どうぞよろしくお願いします", "よろしくおねがいします", "よろしくお願いします"], keyword: "よろしく", tip: "일본 첫인사에서 빠질 수 없는 필수 표현입니다." },
            { kr: "어제는 즐거웠습니다.", answers: ["昨日は楽しかったです", "きのうはたのしかったです"], keyword: "楽しかった", tip: "지나간 일에 대한 소감을 말할 때 과거형(-かった)을 씁니다." },
            { kr: "날씨가 좋네요.", answers: ["いい天気ですね", "いいお天気ですね", "天気がいいですね"], keyword: "天気", tip: "일본인들이 가장 많이 하는 스몰토크 주제 중 하나입니다." },
            { kr: "비가 오네요.", answers: ["雨が降っていますね", "雨ですね", "雨が降ってる"], keyword: "雨", tip: "우산을 챙겨야 할 때 쓸 수 있는 표현입니다." },
            { kr: "나중에 봐요.", answers: ["またあとで", "後でね", "また後で"], keyword: "後で", tip: "헤어질 때 조금 있다가 다시 보다는 의미입니다." },
            { kr: "조심히 가세요.", answers: ["気をつけて帰ってください", "気をつけて", "気をつけてね"], keyword: "気をつけて", tip: "상대방이 떠날 때 건네는 따뜻한 인사입니다." },
            { kr: "잘 다녀오세요.", answers: ["いってらっしゃい", "行ってらっしゃい"], keyword: "いってらっしゃい", tip: "집에서 나가는 사람에게 건네는 말입니다." },
            { kr: "다녀왔습니다.", answers: ["ただいま", "ただいま戻りました"], keyword: "ただいま", tip: "외출 후 집에 돌아왔을 때의 인사입니다." },
            { kr: "환영합니다.", answers: ["いらっしゃいませ", "ようこそ"], keyword: "いらっしゃいませ", tip: "가게에 들어갈 때 점원들이 외치는 소리입니다." },
            { kr: "무엇을 도와드릴까요?", answers: ["何かお手伝いしましょうか", "いかがなさいますか", "何名様ですか"], keyword: "お手伝い", tip: "상대를 도울 때 쓰는 정중한 표현입니다." },
            { kr: "예약을 했습니다.", answers: ["予約をしました", "予約しているんですが", "予約した〇〇です"], keyword: "予約", tip: "식당이나 호텔에 갔을 때 유용합니다." },
            { kr: "추워요.", answers: ["さむいです", "寒いです", "寒っ"], keyword: "寒", tip: "날씨가 추울 때 감탄사로 쓰입니다." },
            { kr: "더워요.", answers: ["あついです", "暑いです", "暑いですね"], keyword: "暑い", tip: "여름철 일본 여행 필수 표현입니다." },
            { kr: "피곤해요.", answers: ["疲れました", "つかれました", "疲れた"], keyword: "疲れた", tip: "일정을 마치고 숙소에 들어갔을 때의 느낌입니다." },
            { kr: "잠을 잘 못 잤어요.", answers: ["あまり眠れませんでした", "よく眠れなかった", "寝不足です"], keyword: "眠れ", tip: "컨디션이 안 좋을 때 설명하는 표현입니다." },
            { kr: "기분이 좋아요.", answers: ["気分がいいです", "きぶんがいいです", "最高です"], keyword: "気分", tip: "기분 좋은 일이 있을 때 표현해 보세요." },

            { kr: "실례하겠습니다.", answers: ["失礼します", "お邪魔します"], keyword: "失礼", tip: "방에 들어가거나 자리를 뜰 때 씁니다." },
            { kr: "오랜만입니다.", answers: ["お久しぶりです", "久しぶり！"], keyword: "久しぶり", tip: "오랫동안 못 보던 사람을 만났을 때 인사합니다." },
            { kr: "잘 지내셨죠?", answers: ["お元気でしたか", "変わりないですか"], keyword: "元気", tip: "오랜만에 만난 지인의 안부를 묻습니다." }
        ];

        let currentIndex = 0;
        let correctCount = 0;
        let totalCount = 0;
        let isAnswered = false;

        function loadNewQuestion() {
            isAnswered = false;
            currentIndex = Math.floor(Math.random() * sentences.length);
            document.getElementById("koreanSentence").innerText = sentences[currentIndex].kr;
            document.getElementById("userInput").value = "";
            document.getElementById("userInput").disabled = false;
            document.getElementById("submitBtn").style.display = "block";
            document.getElementById("resultBox").style.display = "none";
            document.getElementById("userInput").focus();
        }

        function checkAnswer() {
            if (isAnswered) return;

            const userText = document.getElementById("userInput").value.trim();
            
            if (!userText) {
                alert("답안을 입력해주세요!");
                document.getElementById("userInput").focus();
                return;
            }

            totalCount++;
            const currentData = sentences[currentIndex];
            const cleanUserText = userText.replace(/[\s！？?.,]/g, "");
            
            let isCorrect = false;
            let isNatural = true;

            for (let ans of currentData.answers) {
                const cleanAns = ans.replace(/[\s！？?.,]/g, "");
                if (cleanUserText === cleanAns) {
                    isCorrect = true;
                    break;
                }
            }

            if (!isCorrect && cleanUserText.includes(currentData.keyword)) {
                isCorrect = true;
                isNatural = false;
            }

            const resultBox = document.getElementById("resultBox");
            const feedbackTitle = document.getElementById("feedbackTitle");
            const feedbackContent = document.getElementById("feedbackContent");
            const nextBtn = document.getElementById("nextBtn");

            resultBox.style.display = "block";

            if (isCorrect) {
                isAnswered = true;
                correctCount++;
                
                document.getElementById("userInput").disabled = true;
                document.getElementById("submitBtn").style.display = "none";
                nextBtn.style.display = "block";

                if (isNatural) {
                    feedbackTitle.innerText = "정답입니다! 🎉";
                    feedbackContent.innerHTML = `완벽한 표현입니다. 원어민들이 자주 쓰는 자연스러운 문장이에요!`;
                } else {
                    feedbackTitle.innerText = "정답 처리되었습니다! 👍 (조금 어색한 부분 있음)";
                    feedbackContent.innerHTML = `의미는 통하지만 다음과 같이 표현하면 더 자연스러워요:<br><strong>추천 표현:</strong> ${currentData.answers[0]}<br><small>💡 ${currentData.tip}</small>`;
                }
                resultBox.className = "result-box correct";
            } else {
                feedbackTitle.innerText = "틀렸습니다 🥲";
                feedbackContent.innerHTML = `다시 시도해 보세요!<br><strong>모범 답안:</strong> ${currentData.answers[0]}<br><small>💡 ${currentData.tip}</small>`;
                resultBox.className = "result-box incorrect";
                nextBtn.style.display = "none";
            }

            updateStats();
        }

        function updateStats() {
            document.getElementById("stats").innerText = `맞춘 문제: ${correctCount} / 시도한 문제: ${totalCount}`;
        }

        document.getElementById("userInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                if (!isAnswered) {
                    checkAnswer();
                }
            }
        });

        window.onload = loadNewQuestion;
    </script>
