<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어 문제</title>
    <style>
        :root {
            --primary-color: #ff5722;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #2c3e50;
            text-align: center;
        }

        .stats {
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .quiz-box {
            margin-bottom: 20px;
        }

        .label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #95a5a6;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .korean-sentence {
            font-size: 1.3rem;
            font-weight: 600;
            background-color: #fdfefe;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.02);
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #e64a19;
        }

        .next-btn {
            background-color: #2e7d32;
            margin-top: 15px;
            display: none;
        }

        .next-btn:hover {
            background-color: #1b5e20;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .result-box.correct {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .result-box.incorrect {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>일본어 문제</h1>
        <div class="stats" id="stats">맞춘 문제: 0 / 시도한 문제: 0</div>

        <div class="quiz-box">
            <span class="label">다음 한국어 문장을 일본어로 번역하세요</span>
            <div class="korean-sentence" id="koreanSentence">문장을 불러오는 중...</div>
            
            <input type="text" id="userInput" placeholder="여기에 일본어를 입력하세요..." autofocus>
            <button id="submitBtn" onclick="checkAnswer()">제출하기</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="feedback-title" id="feedbackTitle"></div>
            <div id="feedbackContent"></div>
            <button class="next-btn" id="nextBtn" onclick="loadNewQuestion()">다음 문제 풀기</button>
        </div>
    </div>

            { kr: "수고하셨습니다.", answers: ["お疲れ様でした"], keyword: "お疲れ様", tip: "수고 인사입니다." },
            { kr: "어떻게 지내세요?", answers: ["お元気ですか"], keyword: "元気", tip: "안부를 묻습니다." },
            { kr: "좋은 하루 되세요.", answers: ["良い一日を"], keyword: "一日", tip: "하루의 행운을 빕니다." },
            { kr: "조심하세요.", answers: ["気をつけて"], keyword: "注意", tip: "주의를 당부합니다." },
            { kr: "괜찮아요?", answers: ["大丈夫ですか"], keyword: "大丈夫", tip: "상태를 살핍니다." },
            { kr: "제가 할게요.", answers: ["私がやります"], keyword: "私", tip: "자원할 때 씁니다." },
            { kr: "도와주세요.", answers: ["助けてください"], keyword: "助けて", tip: "도움을 청합니다." },
            { kr: "무슨 일이에요?", answers: ["どうしましたか"], keyword: "どう", tip: "이유를 묻습니다." },
            { kr: "별거 아닙니다.", answers: ["何でもないです"], keyword: "何でも", tip: "대수롭지 않게 넘깁니다." },
            { kr: "믿을 수 없어요.", answers: ["信じられない"], keyword: "信じ", tip: "놀라움을 표현합니다." },
            { kr: "정말이에요?", answers: ["本当ですか"], keyword: "本当", tip: "사실 여부를 묻습니다." },
            { kr: "그렇군요.", answers: ["そうなんですね", "なるほど"], keyword: "そう", tip: "수긍할 때 씁니다." },
            { kr: "아닙니다.", answers: ["違います", "いいえ"], keyword: "違う", tip: "부정할 때 씁니다." },
            { kr: "좋아요!", answers: ["いいですね"], keyword: "良い", tip: "동의할 때 씁니다." },
            { kr: "싫어요.", answers: ["嫌です"], keyword: "嫌", tip: "거부할 때 씁니다." },
            { kr: "나중에 얘기해요.", answers: ["あとで話しましょう"], keyword: "後で", tip: "나중을 기약합니다." },
            { kr: "먼저 가세요.", answers: ["先にどうぞ", "お先に"], keyword: "先", tip: "양보할 때 씁니다." },
            { kr: "실례하겠습니다.", answers: ["失礼します"], keyword: "失礼", tip: "인사할 때 씁니다." },
            { kr: "오랜만입니다.", answers: ["お久しぶりです"], keyword: "久しぶり", tip: "오랜만인 인사입니다." },
            { kr: "잘 지내셨죠?", answers: ["お元気でしたか"], keyword: "元気", tip: "안부를 묻습니다." }
        ];

        let currentIndex = 0;
        let correctCount = 0;
        let totalCount = 0;
        let isAnswered = false;

        function loadNewQuestion() {
            isAnswered = false;
            currentIndex = Math.floor(Math.random() * sentences.length);
            const sentenceEl = document.getElementById("koreanSentence");
            if (sentenceEl) {
                sentenceEl.innerText = sentences[currentIndex].kr;
            }
            const inputEl = document.getElementById("userInput");
            if (inputEl) {
                inputEl.value = "";
                inputEl.disabled = false;
                inputEl.focus();
            }
            const submitBtn = document.getElementById("submitBtn");
            if (submitBtn) {
                submitBtn.style.display = "block";
            }
            const resultBox = document.getElementById("resultBox");
            if (resultBox) {
                resultBox.style.display = "none";
            }
        }

        function checkAnswer() {
            if (isAnswered) return;

            const inputEl = document.getElementById("userInput");
            const userText = inputEl ? inputEl.value.trim() : "";
            
            if (!userText) {
                alert("답안을 입력해주세요!");
                if (inputEl) inputEl.focus();
                return;
            }

            totalCount++;
            const currentData = sentences[currentIndex];
            const cleanUserText = userText.replace(/[\s！？?.,]/g, "");
            
            let isCorrect = false;
            let isNatural = true;

            for (let ans of currentData.answers) {
                const cleanAns = ans.replace(/[\s！？?.,]/g, "");
                if (cleanUserText === cleanAns) {
                    isCorrect = true;
                    break;
                }
            }

            if (!isCorrect && cleanUserText.includes(currentData.keyword)) {
                isCorrect = true;
                isNatural = false;
            }

            const resultBox = document.getElementById("resultBox");
            const feedbackTitle = document.getElementById("feedbackTitle");
            const feedbackContent = document.getElementById("feedbackContent");
            const nextBtn = document.getElementById("nextBtn");

            if (resultBox) resultBox.style.display = "block";

            if (isCorrect) {
                isAnswered = true;
                correctCount++;
                
                if (inputEl) inputEl.disabled = true;
                const submitBtn = document.getElementById("submitBtn");
                if (submitBtn) submitBtn.style.display = "none";
                if (nextBtn) nextBtn.style.display = "block";

                if (isNatural) {
                    if (feedbackTitle) feedbackTitle.innerText = "정답입니다! 🎉";
                    if (feedbackContent) feedbackContent.innerHTML = `완벽한 표현입니다. 원어민들이 자주 쓰는 자연스러운 문장이에요!`;
                } else {
                    if (feedbackTitle) feedbackTitle.innerText = "정답 처리되었습니다! 👍 (조금 어색한 부분 있음)";
                    if (feedbackContent) feedbackContent.innerHTML = `의미는 통하지만 다음과 같이 표현하면 더 자연스러워요:<br><strong>추천 표현:</strong> ${currentData.answers[0]}<br><small>💡 ${currentData.tip}</small>`;
                }
                if (resultBox) resultBox.className = "result-box correct";
            } else {
                if (feedbackTitle) feedbackTitle.innerText = "틀렸습니다 🥲";
                if (feedbackContent) feedbackContent.innerHTML = `다시 시도해 보세요!<br><strong>모범 답안:</strong> ${currentData.answers[0]}<br><small>💡 ${currentData.tip}</small>`;
                if (resultBox) resultBox.className = "result-box incorrect";
                if (nextBtn) nextBtn.style.display = "none";
            }

            updateStats();
        }

        function updateStats() {
            const statsEl = document.getElementById("stats");
            if (statsEl) {
                statsEl.innerText = `맞춘 문제: ${correctCount} / 시도한 문제: ${totalCount}`;
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const inputEl = document.getElementById("userInput");
            if (inputEl) {
                inputEl.addEventListener("keypress", function(event) {
                    if (event.key === "Enter") {
                        if (!isAnswered) {
                            checkAnswer();
                        }
                    }
                });
            }
            loadNewQuestion();
        });
    </script>
</body>
</html>
