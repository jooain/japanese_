<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>일본어를 한국어로</title>
    <style>
        :root {
            --primary-color: #e53935; /* 빨간색 테마 */
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 600px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #2c3e50;
            text-align: center;
        }

        .api-key-box {
            background-color: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            border: 1px solid #e9ecef;
        }

        .api-key-box input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            font-size: 0.9rem;
            border: 1px solid #ced4da;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .saved-msg {
            font-size: 0.75rem;
            color: #2e7d32;
            margin-top: 4px;
            display: none;
        }

        .stats {
            text-align: center;
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .quiz-box {
            margin-bottom: 20px;
        }

        .label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #95a5a6;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: block;
        }

        .japanese-sentence {
            font-size: 1.4rem;
            font-weight: 600;
            background-color: #fdfefe;
            border-left: 4px solid var(--primary-color);
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 4px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.02);
            min-height: 30px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            font-size: 1.1rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            box-sizing: border-box;
            transition: border-color 0.3s;
            margin-bottom: 15px;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #c62828;
        }

        .next-btn {
            background-color: #2e7d32;
            margin-top: 15px;
            display: none;
        }

        .next-btn:hover {
            background-color: #1b5e20;
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            display: none;
        }

        .result-box.correct {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .result-box.incorrect {
            background-color: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }

        .feedback-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>일본어를 한국어로</h1>
        
        <div class="api-key-box">
            <label for="apiKeyInput">🔑 Gemini API 키 (브라우저에 자동 저장됨):</label>
            <input type="password" id="apiKeyInput" placeholder="AIzaSy... 형식의 키를 입력하세요" oninput="saveApiKey()">
            <div id="savedMsg" class="saved-msg">✓ API 키가 안전하게 저장되었습니다!</div>
        </div>

        <div class="stats" id="stats">맞춘 문제: 0 / 시도한 문제: 0</div>

        <div class="quiz-box">
            <span class="label">다음 일본어 문장의 한국어 뜻을 입력하세요</span>
            <div class="japanese-sentence" id="japaneseSentence">API 키를 입력하면 AI가 문제를 생성합니다.</div>
            
            <input type="text" id="userInput" placeholder="여기에 한국어 뜻을 입력하세요..." disabled autofocus>
            <button id="submitBtn" onclick="checkAnswerWithGemini()" disabled>제출하기 (AI 채점)</button>
        </div>

        <div class="result-box" id="resultBox">
            <div class="feedback-title" id="feedbackTitle"></div>
            <div id="feedbackContent"></div>
            <button class="next-btn" id="nextBtn" onclick="loadNewQuestion()">다음 문제 풀기</button>
        </div>
    </div>

    <script>
        let currentJp = "";
        let correctCount = 0;
        let totalCount = 0;
        let isAnswered = false;

        window.addEventListener("DOMContentLoaded", function() {
            const savedKey = localStorage.getItem("gemini_quiz_api_key");
            if (savedKey) {
                document.getElementById("apiKeyInput").value = savedKey;
                document.getElementById("savedMsg").style.display = "block";
                loadNewQuestion();
            }
        });

        function saveApiKey() {
            const apiKey = document.getElementById("apiKeyInput").value.trim();
            const savedMsg = document.getElementById("savedMsg");
            if (apiKey) {
                localStorage.setItem("gemini_quiz_api_key", apiKey);
                savedMsg.style.display = "block";
                if (!currentJp && document.getElementById("japaneseSentence").innerText.includes("API 키")) {
                    loadNewQuestion();
                }
            } else {
                localStorage.removeItem("gemini_quiz_api_key");
                savedMsg.style.display = "none";
            }
        }

        async function callGemini(promptText) {
            const apiKey = localStorage.getItem("gemini_quiz_api_key") || document.getElementById("apiKeyInput").value.trim();
            if (!apiKey) {
                alert("Gemini API 키를 입력해주세요!");
                return null;
            }

            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: promptText }] }]
                })
            });

            if (!response.ok) {
                throw new Error(`API 통신 오류 (상태 코드: ${response.status}). API 키를 확인해주세요.`);
            }

            const data = await response.json();
            if (!data.candidates || data.candidates.length === 0) {
                throw new Error("AI로부터 응답을 받지 못했습니다.");
            }

            return data.candidates[0].content.parts[0].text.trim();
        }

        async function loadNewQuestion() {
            isAnswered = false;
            const sentenceEl = document.getElementById("japaneseSentence");
            sentenceEl.innerText = "AI가 새로운 문제를 만드는 중...";
            
            const inputEl = document.getElementById("userInput");
            inputEl.value = "";
            inputEl.disabled = true;
            
            const submitBtn = document.getElementById("submitBtn");
            submitBtn.disabled = true;
            submitBtn.innerText = "문제 생성 중...";

            const resultBox = document.getElementById("resultBox");
            resultBox.style.display = "none";

            const prompt = `일본어 학습자를 위한 번역 퀴즈용 일본어 문장을 하나 무작위로 생성해주세요.
반말과 존댓말이 자연스럽게 섞인 일상 회화 표현이어야 합니다.
반드시 아래 JSON 형식으로만 응답하세요 (마크다운 백틱이나 다른 설명 없이 오직 중괄호로 시작하는 JSON만):
{
  "jp": "생성된 일본어 문장"
}`;

            try {
                const textResponse = await callGemini(prompt);
                const cleanJsonStr = textResponse.replace(/```json/g, "").replace(/```/g, "").trim();
                const parsed = JSON.parse(cleanJsonStr);

                currentJp = parsed.jp;
                sentenceEl.innerText = currentJp;
                
                inputEl.disabled = false;
                inputEl.focus();
                submitBtn.disabled = false;
                submitBtn.innerText = "제출하기 (AI 채점)";

            } catch (error) {
                alert(error.message);
                sentenceEl.innerText = "문제 로드 실패 (API 키를 확인하세요)";
                submitBtn.disabled = false;
                submitBtn.innerText = "다시 시도";
            }
        }

        async function checkAnswerWithGemini() {
            if (isAnswered) return;

            const inputEl = document.getElementById("userInput");
            const userText = inputEl ? inputEl.value.trim() : "";
            
            if (!userText) {
                alert("답안을 입력해주세요!");
                if (inputEl) inputEl.focus();
                return;
            }

            const submitBtn = document.getElementById("submitBtn");
            submitBtn.innerText = "AI가 채점 중...";
            submitBtn.disabled = true;

            const prompt = `당신은 유연하고 친절한 일본어 번역 퀴즈 채점관입니다.
일본어 원문: "${currentJp}"
사용자가 입력한 한국어 뜻: "${userText}"

의미가 정확히 통하고 자연스러운 한국어 번역인지 판단해주세요. 핵심 의미가 통한다면 사소한 표현 차이는 관대하게 정답(true)으로 인정해주세요.
반드시 아래 JSON 형식으로만 응답하세요 (마크다운 백틱이나 다른 설명 없이 오직 중괄호로 시작하는 JSON만):
{
  "isCorrect": true 또는 false,
  "feedback": "정답인 경우 칭찬과 자연스러운 뜻 설명, 틀린 경우 모범 한국어 번역과 친절한 설명 포함해서 한국어로 작성"
}`;

            try {
                const textResponse = await callGemini(prompt);
                const cleanJsonStr = textResponse.replace(/```json/g, "").replace(/```/g, "").trim();
                const result = JSON.parse(cleanJsonStr);

                totalCount++;
                const resultBox = document.getElementById("resultBox");
                const feedbackTitle = document.getElementById("feedbackTitle");
                const feedbackContent = document.getElementById("feedbackContent");
                const nextBtn = document.getElementById("nextBtn");

                resultBox.style.display = "block";
                isAnswered = true;
                inputEl.disabled = true;
                submitBtn.style.display = "none";
                nextBtn.style.display = "block";

                if (result.isCorrect) {
                    correctCount++;
                    feedbackTitle.innerText = "정답입니다! 🎉";
                    feedbackContent.innerHTML = result.feedback;
                    resultBox.className = "result-box correct";
                } else {
                    feedbackTitle.innerText = "아쉽네요 🥲";
                    feedbackContent.innerHTML = result.feedback;
                    resultBox.className = "result-box incorrect";
                }

                updateStats();

            } catch (error) {
                alert(error.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "제출하기 (AI 채점)";
            }
        }

        function updateStats() {
            const statsEl = document.getElementById("stats");
            statsEl.innerText = `맞춘 문제: ${correctCount} / 시도한 문제: ${totalCount}`;
        }

        document.addEventListener("DOMContentLoaded", function() {
            const inputEl = document.getElementById("userInput");
            inputEl.addEventListener("keypress", function(event) {
                if (event.key === "Enter") {
                    const submitBtn = document.getElementById("submitBtn");
                    const nextBtn = document.getElementById("nextBtn");
                    if (!isAnswered && !submitBtn.disabled) {
                        checkAnswerWithGemini();
                    } else if (isAnswered && nextBtn.style.display === "block") {
                        loadNewQuestion();
                    }
                }
            });
        });
    </script>
</body>
</html>
